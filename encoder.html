<!DOCTYPE html>
<html>
<body>
  <h3>Zero-Library PNG Encoder for DEMO.pk3</h3>
  <input type="file" id="picker" accept=".pk3" />
  <p id="status"></p>

  <script>
    const crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[n] = c;
    }
    function crc32(buf) {
      let c = 0xffffffff;
      for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
      return (c ^ 0xffffffff) >>> 0;
    }

    function makeChunk(type, data) {
      const chunk = new Uint8Array(12 + data.length);
      const view = new DataView(chunk.buffer);
      view.setUint32(0, data.length);
      for (let i = 0; i < 4; i++) chunk[4 + i] = type.charCodeAt(i);
      chunk.set(data, 8);
      view.setUint32(8 + data.length, crc32(chunk.subarray(4, 8 + data.length)));
      return chunk;
    }

    async function encodeRawPNG(rgbBytes, width, height) {
      const scanlines = new Uint8Array(height * (1 + width * 3));
      for (let y = 0; y < height; y++) {
        scanlines[y * (1 + width * 3)] = 0;
        const srcStart = y * width * 3;
        scanlines.set(rgbBytes.subarray(srcStart, srcStart + width * 3), y * (1 + width * 3) + 1);
      }

      const cs = new CompressionStream('deflate');
      const writer = cs.writable.getWriter();
      writer.write(scanlines);
      writer.close();
      const compressed = new Uint8Array(await new Response(cs.readable).arrayBuffer());

      const ihdr = new Uint8Array(13);
      const iv = new DataView(ihdr.buffer);
      iv.setUint32(0, width);
      iv.setUint32(4, height);
      ihdr.set(Uint8Array.of(8, 2), 8); // 8-bit depth, RGB color type

      const sig = Uint8Array.of(137, 80, 78, 71, 13, 10, 26, 10);
      return new Blob(
        [sig, makeChunk('IHDR', ihdr), makeChunk('IDAT', compressed), makeChunk('IEND', new Uint8Array(0))],
        { type: 'image/png' }
      );
    }

    document.getElementById('picker').onchange = async (e) => {
      const file = e.target.files.item(0);
      if (!file) return;
      document.getElementById('status').textContent = 'Encoding... please wait a few seconds.';

      const buf = new Uint8Array(await file.arrayBuffer());
      const half = Math.ceil(buf.length / 2);

      for (let idx = 0; idx < 2; idx++) {
        const chunk = idx === 0 ? buf.subarray(0, half) : buf.subarray(half);
        const payload = new Uint8Array(chunk.length + 4);
        new DataView(payload.buffer).setUint32(0, chunk.length, true);
        payload.set(chunk, 4);

        const width = 2048;
        const height = Math.ceil((payload.length / 3) / width);
        const padded = new Uint8Array(width * height * 3);
        padded.set(payload);

        const blob = await encodeRawPNG(padded, width, height);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `demo_part${idx + 1}.png`;
        a.click();
      }
      document.getElementById('status').textContent = 'Done! Two lossless PNGs downloaded.';
    };
  </script>
</body>
</html>
