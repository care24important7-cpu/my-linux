<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: radial-gradient(circle at 20% 20%, #1e3a8a, #0f172a 70%); color: #f8fafc; }
    #desktop { position: relative; height: calc(100vh - 40px); padding: 16px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 14px; }
    .icon { width: 80px; text-align: center; cursor: pointer; padding: 8px 4px; border-radius: 8px; }
    .icon:hover { background: rgba(255,255,255,0.14); }
    .icon-img { font-size: 32px; }
    .icon-label { font-size: 12px; margin-top: 4px; text-shadow: 0 1px 3px #000; }
    .win { position: absolute; background: #1e293b; border: 1px solid #475569; border-radius: 8px; box-shadow: 0 18px 40px rgba(0,0,0,0.55); display: flex; flex-direction: column; overflow: hidden; resize: both; min-width: 280px; min-height: 180px; }
    .win-head { background: #0f172a; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; cursor: move; font-size: 13px; font-weight: 600; border-bottom: 1px solid #334155; }
    .win-close { background: #ef4444; color: #fff; border: none; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-weight: bold; }
    .win-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; user-select: text; }
    #taskbar { position: fixed; bottom: 0; left: 0; right: 0; height: 40px; background: rgba(15,23,42,0.92); border-top: 1px solid #334155; display: flex; align-items: center; padding: 0 10px; gap: 8px; }
    #sync-btn { background: #2563eb; color: #fff; border: none; padding: 5px 12px; border-radius: 5px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div id="desktop"></div>
  <div id="taskbar"><button id="sync-btn" onclick="loadApps()">↻ Sync Apps</button></div>
  <script>
    let z = 10;
    window.WebOS = {
      fs: {},
      openWindow(title, w, h, buildFn) {
        const win = document.createElement("div");
        win.className = "win";
        win.style.cssText = `width:${w||560}px;height:${h||400}px;left:${60+(z%8)*20}px;top:${30+(z%6)*20}px;z-index:${++z}`;
        win.innerHTML = `<div class="win-head"><span>${title}</span><button class="win-close">×</button></div><div class="win-body"></div>`;
        document.getElementById("desktop").appendChild(win);
        const head = win.querySelector(".win-head"), close = win.querySelector(".win-close"), body = win.querySelector(".win-body");
        close.onclick = () => win.remove();
        win.onmousedown = () => { win.style.zIndex = ++z; };
        let drag = false, ox = 0, oy = 0;
        head.onmousedown = e => { if (e.target !== close) { drag = true; ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop; } };
        window.addEventListener("mousemove", e => { if (drag) { win.style.left = Math.max(0, e.clientX - ox) + "px"; win.style.top = Math.max(0, e.clientY - oy) + "px"; } });
        window.addEventListener("mouseup", () => { drag = false; });
        buildFn(body);
      }
    };
    async function loadApps() {
      const desk = document.getElementById("desktop");
      desk.querySelectorAll(".icon").forEach(e => e.remove());
      const apps = await fetch("apps/manifest.json?t=" + Date.now()).then(r => r.json()).catch(() => []);
      apps.forEach(app => {
        const el = document.createElement("div");
        el.className = "icon";
        el.innerHTML = `<div class="icon-img">${app.icon||"📦"}</div><div class="icon-label">${app.name}</div>`;
        el.onclick = () => {
          if (app.type === "iframe") {
            WebOS.openWindow(app.icon + " " + app.name, app.width, app.height, b => {
              b.innerHTML = `<iframe src="${app.url}" style="width:100%;height:100%;border:none;background:#000;"></iframe>`;
            });
          } else if (app.file) {
            const s = document.createElement("script");
            s.src = app.file + "?t=" + Date.now();
            document.body.appendChild(s);
          }
        };
        desk.appendChild(el);
      });
    }
    loadApps();
  </script>
</body>
</html>
