<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://w3.org" style="width:100%;height:100%;margin:0;padding:0;background:#111;overflow:hidden;">
      <iframe xmlns="http://www.w3.org/1999/xhtml" id="linux_frame" style="width:100vw;height:100vh;border:none;margin:0;padding:0;background:#000;"></iframe>
    </div>
  </foreignObject>
  <script type="application/ecmascript"><![CDATA[
  <script type="application/ecmascript"><![CDATA[
    (function() {
      var frame = document.getElementById('daw-frame');
      var doc = frame.contentWindow.document;
      var baseUrl = 'https://code4fukui.github.io/AudioMass/src/';

      var html = [
        '<!DOCTYPE html>',
        '<html><head><meta charset="utf-8">',
        '<base href="' + baseUrl + '">',
        '<title>AudioMass Studio</title>',
        '<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#111;color:#eee;font-family:sans-serif;overflow:hidden;}</style>',
        '<script>',
        '  (function(){',
        '    var mem = {};',
        '    try { window.localStorage.getItem("test"); } catch(e) {',
        '      Object.defineProperty(window, "localStorage", {',
        '        value: {',
        '          getItem: function(k){ return mem.hasOwnProperty(k) ? mem[k] : null; },',
        '          setItem: function(k,v){ mem[k] = String(v); },',
        '          removeItem: function(k){ delete mem[k]; },',
        '          clear: function(){ mem = {}; }',
        '        }',
        '      });',
        '    }',
        '  })();',
        '<\/script>',
        '</head><body>',
        '<div id="loader" style="display:flex;align-items:center;justify-content:center;height:100%;">Loading AudioMass Studio...</div>',
        '<script>',
        '  fetch("' + baseUrl + 'index.html")',
        '    .then(function(r){ return r.text(); })',
        '    .then(function(src){',
        '      src = src.replace(/<head>/i, "<head><base href=\\"' + baseUrl + '\\">");',
        '      document.open();',
        '      document.write(src);',
        '      document.close();',
        '    })',
        '    .catch(function(err){',
        '      document.getElementById("loader").textContent = "Failed to load AudioMass: " + err;',
        '    });',
        '<\/script>',
        '</body></html>'
      ].join('\n');

      doc.open();
      doc.write(html);
      doc.close();
    })();
  ]]></script>
</svg>
